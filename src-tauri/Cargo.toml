[package]
name = "awen"
version = "0.3.1"
description = "A focused Markdown writing app"
license = "GPL-3.0-or-later"
authors = ["Daniel Keane"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "awen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

# Native export panel and PDF output (src/export.rs), title popover (src/rename.rs), accent color (src/accent.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSFileManager", "NSGeometry", "NSNotification", "NSObject", "NSRange", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
  "block2",
  "objc2-uniform-type-identifiers",
  "NSAppearance",
  "NSApplication",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSColorSpace",
  "NSControl",
  "NSDocumentController",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSPanel",
  "NSPopover",
  "NSPopUpButton",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSSavePanel",
  "NSSpellChecker",
  "NSText",
  "NSTextField",
  "NSTextView",
  "NSTokenField",
  "NSView",
  "NSViewController",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", features = ["objc2-app-kit", "WKWebView"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType", "UTCoreTypes"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell", "UI", "UI_ViewManagement"] }
# Explorer starts a second process per opened file; this forwards it (src/lib.rs).
tauri-plugin-single-instance = "2"
# The version muda and tao already use (src/menubar.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
