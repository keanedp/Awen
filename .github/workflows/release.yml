# Pushing a tag vX.Y.Z (see `make release`) builds the installers and attaches
# them to a draft GitHub release. Check the draft, then publish it by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check the tag matches the app version
        run: node scripts/version.mjs check "$TAG"

      # Reuses the release if it already exists, so a failed run can be re-run.
      # Drafts aren't found by tag through the API, so look them up in the list.
      # A new draft can be missing from that list for a moment, so check the
      # create call's result, not a second lookup. The builds find the draft by
      # tag minutes later, when it's listed.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            prerelease=false
            if [[ "$TAG" == *-* ]]; then prerelease=true; fi
            id=$(gh api "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Awen ${TAG#v}" \
              -F draft=true -F prerelease="$prerelease" -F generate_release_notes=true --jq .id)
          fi
          if [ -z "$id" ]; then echo "::error::No release for $TAG"; exit 1; fi

  build:
    needs: prepare
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows releases are paused until the Windows build is ready.
          # Uncomment to ship the setup .exe and .msi again (CI still builds it).
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci
      - run: npm test

      # macOS builds are ad-hoc signed (bundle.macOS.signingIdentity "-").
      # Developer ID signing and notarization (W-035) will pass APPLE_* secrets here.
      - run: npm run tauri build -- --target ${{ matrix.target }}

      # Only the installers. (tauri-action was dropped because it always adds
      # a .app.tar.gz, which is only useful to the updater, W-071.)
      # --clobber replaces them when a failed run is re-run.
      - name: Upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          shopt -s nullglob
          files=("$BUNDLE"/dmg/*.dmg "$BUNDLE"/nsis/*-setup.exe "$BUNDLE"/msi/*.msi)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No installers in $BUNDLE"; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --clobber

      # GitHub only stores attestations for public repos (or organization-owned
      # private ones), so this repo gets them once it's public.
      - if: runner.os == 'macOS' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - if: runner.os == 'Windows' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
